<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PLATTERS — рофл-сайт</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <div class="content">
            <!-- Логотип -->
            <div class="logo">
                <h1 class="title">PLATTERS</h1>
                <p class="subtitle">— рофл-сайт на вайб-коде</p>
            </div>

            <!-- Описание -->
            <p class="desc">
                Не имеет никакой связи с настоящей компанией (которой и так нет).<br>
                Но планы имеются.
            </p>

            <!-- Кнопки -->
            <div class="buttons">
                <a href="#" class="btn btn-mobile">
                    <span class="btn-text">PLTRS.MOBILE</span>
                    <span class="btn-icon">
                        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" d="m4.5 19.5 15-15m0 0H8.25m11.25 0v11.25" />
                        </svg>
                    </span>
                </a>
                <a href="#" class="btn btn-bank">
                    <span class="btn-text">PLTRS.BANK</span>
                    <span class="btn-icon">
                        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M6 18 18 6M6 6l12 12" />
                        </svg>
                    </span>
                </a>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
